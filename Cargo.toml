[package]
name = "u-insight"
version = "0.18.0"
rust-version = "1.85"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
repository = "https://github.com/iyulab/u-insight"
description = "Statistical analysis and data profiling engine with C FFI bindings."
readme = "README.md"
keywords = ["statistics", "profiling", "analytics", "ffi"]
categories = ["algorithms", "science"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde"]

[dependencies]
u-analytics = "0.11"
u-numflow = "0.5"
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
proptest = "1.4"
serde_json = "1.0"

[lib]
name = "u_insight"
crate-type = ["rlib", "cdylib", "staticlib"]

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
